<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sunlit cloudscape">
  <defs>
    <!-- Banner is anchored to the top of this artboard, so the interest sits
         in the upper two-thirds where it will actually be visible. -->
    <linearGradient id="bSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#b9d0e6"/>
      <stop offset="0.24" stop-color="#d3e2ef"/>
      <stop offset="0.5"  stop-color="#eaeff4"/>
      <stop offset="0.72" stop-color="#f9f0e2"/>
      <stop offset="1"    stop-color="#f3e6d2"/>
    </linearGradient>

    <radialGradient id="bSun" cx="0.24" cy="0.26" r="0.66">
      <stop offset="0"    stop-color="#fffaef" stop-opacity="0.98"/>
      <stop offset="0.36" stop-color="#fdf0d9" stop-opacity="0.44"/>
      <stop offset="1"    stop-color="#fdf0d9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bTint" cx="0.82" cy="0.66" r="0.55">
      <stop offset="0" stop-color="#deb887" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#deb887" stop-opacity="0"/>
    </radialGradient>

    <filter id="bCloud" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="bHaze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <radialGradient id="bCalm" cx="0.5" cy="0.34" r="0.42">
      <stop offset="0"   stop-color="#fefaf3" stop-opacity="0.58"/>
      <stop offset="0.7" stop-color="#fefaf3" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#fefaf3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bSky)"/>
  <rect width="1600" height="900" fill="url(#bSun)"/>
  <rect width="1600" height="900" fill="url(#bTint)"/>

  <!-- Soft haze band behind the cloud deck -->
  <g filter="url(#bHaze)" opacity="0.8">
    <ellipse cx="420"  cy="470" rx="560" ry="90" fill="#ffffff"/>
    <ellipse cx="1220" cy="500" rx="580" ry="96" fill="#fdf4e7"/>
  </g>

  <!-- Cumulus deck, the light echo of the nebula's billowing structure -->
  <g filter="url(#bCloud)">
    <g fill="#ffffff" opacity="0.97">
      <circle cx="238" cy="452" r="104"/>
      <circle cx="348" cy="424" r="80"/>
      <circle cx="440" cy="466" r="92"/>
      <circle cx="140" cy="486" r="76"/>
      <circle cx="524" cy="486" r="66"/>
    </g>
    <g fill="#f4e8d7" opacity="0.9">
      <circle cx="300" cy="518" r="98"/>
      <circle cx="470" cy="530" r="78"/>
      <circle cx="160" cy="536" r="70"/>
    </g>

    <g fill="#ffffff" opacity="0.98">
      <circle cx="1170" cy="428" r="122"/>
      <circle cx="1310" cy="462" r="96"/>
      <circle cx="1048" cy="470" r="92"/>
      <circle cx="1246" cy="386" r="78"/>
      <circle cx="1420" cy="492" r="72"/>
    </g>
    <g fill="#f2e4d0" opacity="0.88">
      <circle cx="1120" cy="512" r="104"/>
      <circle cx="1300" cy="532" r="86"/>
    </g>

    <!-- Mid-field wisps, kept thin so the heading stays clear -->
    <g fill="#ffffff" opacity="0.72">
      <ellipse cx="760"  cy="452" rx="150" ry="34"/>
      <ellipse cx="880"  cy="492" rx="120" ry="26"/>
      <ellipse cx="660"  cy="500" rx="110" ry="22"/>
    </g>

    <!-- High cirrus above -->
    <g opacity="0.55" fill="#ffffff">
      <ellipse cx="640"  cy="150" rx="250" ry="15"/>
      <ellipse cx="1140" cy="112" rx="290" ry="13"/>
      <ellipse cx="330"  cy="196" rx="210" ry="12"/>
      <ellipse cx="1420" cy="206" rx="200" ry="12"/>
    </g>
  </g>

  <!-- Warm shadowed undersides -->
  <g filter="url(#bCloud)" opacity="0.3">
    <ellipse cx="300"  cy="566" rx="210" ry="30" fill="#c39a68"/>
    <ellipse cx="1200" cy="572" rx="250" ry="32" fill="#c39a68"/>
  </g>

  <!-- Sparkles: the daylight counterpart to the nebula's stars -->
  <g fill="#a87f50" opacity="0.45">
    <circle cx="196"  cy="104" r="2.4"/><circle cx="742"  cy="78"  r="1.8"/>
    <circle cx="1096" cy="96"  r="2.2"/><circle cx="1466" cy="70"  r="1.9"/>
    <circle cx="540"  cy="252" r="1.7"/><circle cx="900"  cy="286" r="2.1"/>
    <circle cx="1288" cy="258" r="1.6"/><circle cx="300"  cy="316" r="2"/>
    <circle cx="1540" cy="352" r="1.8"/><circle cx="76"   cy="238" r="1.7"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="640"  cy="126" r="2.6"/><circle cx="1180" cy="182" r="2.2"/>
    <circle cx="392"  cy="188" r="2"/><circle cx="1420" cy="132" r="2.4"/>
  </g>

  <rect width="1600" height="900" fill="url(#bCalm)"/>
</svg>
